<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Request a Song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b12;--card:#161624;--line:#2a2a40;--text:#f4f4fa;--muted:#9a9ab5;--accent:#ff3d7f;--accent2:#7c5cff;--ok:#2fd27a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2a1340 0,transparent 55%),radial-gradient(circle at 100% 100%,#10223f 0,transparent 50%),var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;padding:28px 16px}
  main{width:100%;max-width:440px}
  .eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-size:12px;margin:0 0 6px}
  h1{font-size:34px;line-height:1.05;margin:0 0 24px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
  label{font-size:13px;color:var(--muted);display:grid;gap:6px}
  input{font:inherit;font-size:17px;color:var(--text);background:#0e0e18;border:1px solid var(--line);border-radius:12px;padding:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:15px;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{min-height:22px;text-align:center;font-size:15px;margin-top:14px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--accent)}
  .tip{display:block;text-align:center;margin-top:18px;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px}
  .tip[hidden]{display:none}
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="djName">Live now</p>
  <h1>Request a <span>song</span></h1>
  <form id="f" autocomplete="off">
    <label>Song *<input id="song" maxlength="100" required placeholder="e.g. Gasolina"></label>
    <label>Artist<input id="artist" maxlength="100" placeholder="e.g. Daddy Yankee"></label>
    <label>Your name (optional)<input id="name" maxlength="40" placeholder="So the DJ can shout you out"></label>
    <button id="btn" type="submit">Send request</button>
  </form>
  <div class="msg" id="msg"></div>
  <a class="tip" id="tip" target="_blank" rel="noopener" hidden></a>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig, DJ_NAME, TIP_URL, TIP_LABEL, COOLDOWN_SECONDS } from "./config.js";

const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
$("djName").textContent = DJ_NAME + " · live now";
if (TIP_URL) { $("tip").href = TIP_URL; $("tip").textContent = "💸 " + TIP_LABEL; $("tip").hidden = false; }

const KEY = "lastRequestAt";
function lastAt(){ try { return +localStorage.getItem(KEY) || 0; } catch { return 0; } }
function setLast(){ try { localStorage.setItem(KEY, Date.now()); } catch {} }

function tick(){
  const left = Math.ceil((lastAt() + COOLDOWN_SECONDS*1000 - Date.now())/1000);
  if (left > 0){ $("btn").disabled = true; $("btn").textContent = `Wait ${left}s`; setTimeout(tick, 1000); }
  else { $("btn").disabled = false; $("btn").textContent = "Send request"; }
}
tick();

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const song = $("song").value.trim();
  if (!song) return;
  $("btn").disabled = true;
  try {
    await push(ref(db, "requests"), {
      song, artist: $("artist").value.trim(), name: $("name").value.trim(),
      ts: serverTimestamp(), status: "new"
    });
    setLast();
    $("msg").className = "msg ok"; $("msg").textContent = "🎶 Sent! The DJ can see it now.";
    $("song").value = ""; $("artist").value = "";
  } catch (err) {
    console.error(err);
    $("msg").className = "msg err"; $("msg").textContent = "Couldn't send — try again in a moment.";
  }
  tick();
});
</script>
</body>
</html>
