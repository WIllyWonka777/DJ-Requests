<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DJ Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050508;--card:#12121c;--card2:#1a1a28;--line:#2c2a46;--text:#fff;--muted:#9a98bb;--accent:#ff3d7f;--accent2:#7c5cff;--cyan:#4de1ff;--ok:#22d07a;--warn:#ffb020}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer;border:0;color:inherit}

  /* PIN gate */
  #gate{height:100%;display:grid;place-items:center;padding:16px}
  #gate form{display:grid;gap:14px;width:100%;max-width:320px;text-align:center}
  #gate h2{margin:0;font-size:24px}
  #pin{font:inherit;font-size:32px;text-align:center;letter-spacing:.4em;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;outline:none}
  #pin:focus{border-color:var(--accent2)}
  .go{background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:14px;padding:16px;font-size:20px;font-weight:700}

  /* App shell: header + hero + list, fills the screen, no page scroll */
  #app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:14px;padding:14px clamp(12px,2vw,28px) 14px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;min-width:0}
  .brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok);flex:none}
  .dot.off{background:var(--accent);box-shadow:0 0 14px var(--accent);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .count{margin-left:auto;font-size:18px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--text);font-size:26px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{padding:9px 14px;border-radius:9px;font-size:15px;font-weight:700;color:var(--muted);background:none}
  .seg button.on{background:var(--text);color:#000}

  /* Hero: the one request that matters right now */
  #hero{display:grid;grid-template-columns:1fr auto;gap:clamp(14px,2vw,28px);align-items:center;background:linear-gradient(135deg,#251036,#11162c);border:2px solid var(--accent2);border-radius:22px;padding:clamp(16px,2.4vw,30px)}
  #hero.fresh{animation:pop 1.6s ease-out}
  @keyframes pop{0%{border-color:var(--accent);box-shadow:0 0 0 6px rgba(255,61,127,.35)}100%{box-shadow:0 0 0 0 transparent}}
  .label{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .badge{background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-size:18px;letter-spacing:0}
  .h-song{font-size:clamp(34px,6.2vw,84px);font-weight:700;line-height:1;word-break:break-word}
  .h-artist{font-size:clamp(20px,3vw,40px);color:#d6d6ee;margin-top:6px}
  .h-meta{font-size:clamp(14px,1.4vw,18px);color:var(--muted);margin-top:10px}
  .h-actions{display:grid;gap:12px}
  .big{min-width:clamp(140px,14vw,220px);padding:clamp(16px,2vw,26px) 20px;border-radius:16px;font-size:clamp(18px,2vw,26px);font-weight:700}
  .big.play{background:var(--ok);color:#00170a}
  .big.skip{background:var(--card2);border:1px solid var(--line)}
  .big:active,.sm:active{transform:scale(.97)}
  .keys{font-size:12px;color:var(--muted);text-align:center}
  #empty{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:clamp(20px,2.4vw,30px);border:2px dashed var(--line);border-radius:22px;padding:40px 16px}

  /* Up next list */
  #listWrap{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:10px}
  .listHead{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #list{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:10px;align-content:start;padding-bottom:8px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px}
  .row.fresh{animation:rowflash 2s ease-out}
  @keyframes rowflash{0%{background:#3a1430;border-color:var(--accent)}}
  .n{font-size:22px;font-weight:700;color:var(--muted);min-width:28px;text-align:center}
  .n.hot{color:#fff;background:var(--accent);border-radius:10px;padding:2px 8px;font-size:18px}
  .r-song{font-size:clamp(20px,1.9vw,26px);font-weight:700;line-height:1.1;word-break:break-word}
  .r-sub{font-size:15px;color:var(--muted);margin-top:3px}
  .r-actions{display:flex;gap:8px}
  .sm{width:52px;height:52px;border-radius:12px;font-size:22px;font-weight:700}
  .sm.play{background:var(--ok);color:#00170a}
  .sm.skip{background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .sm.back{width:auto;padding:0 16px;font-size:15px;background:var(--card2);border:1px solid var(--line)}

  /* Undo toast */
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#000;border-radius:14px;padding:12px 12px 12px 18px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:17px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:calc(100% - 32px)}
  #toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast button{background:#000;color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;flex:none}

  /* ===== DJ-hacker stage (always running, behind everything) ===== */
  #stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#020205}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%}
  #app{position:relative;z-index:1}
  .hud{position:absolute;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:#39ff88;text-shadow:0 0 8px rgba(57,255,136,.6);font-size:13px;line-height:1.55;letter-spacing:.04em}
  #term{left:clamp(12px,2vw,28px);bottom:clamp(110px,15vh,150px);width:min(44vw,540px);height:12.5em;overflow:hidden;opacity:.92;padding:8px 12px;border:1px solid rgba(57,255,136,.25);border-radius:10px;background:rgba(1,8,4,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%);mask-image:linear-gradient(to bottom,transparent,#000 35%);display:flex;flex-direction:column;justify-content:flex-end}
  #term div{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #term .hot{color:#ff5c9a;text-shadow:0 0 10px rgba(255,61,127,.8)}
  #term .cy{color:#4de1ff;text-shadow:0 0 8px rgba(77,225,255,.6)}
  #term .cur::after{content:"█";animation:cur 1s steps(1) infinite;margin-left:2px}
  @keyframes cur{50%{opacity:0}}
  #deck{right:clamp(12px,2vw,28px);bottom:clamp(110px,15vh,150px);width:min(34vw,380px);border:1px solid rgba(57,255,136,.35);border-radius:10px;padding:10px 14px;background:rgba(2,10,6,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:.92}
  #deck .t{display:flex;justify-content:space-between;gap:10px}
  #deck .dv{font-size:24px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(57,255,136,.9)}
  #deck .lbl{color:rgba(57,255,136,.6);font-size:11px}
  #deck .np{color:#4de1ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #deck .led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#39ff88;box-shadow:0 0 8px #39ff88;margin-right:6px}
  #deck .led.beat{background:#ff3d7f;box-shadow:0 0 12px #ff3d7f}
  /* Glass cards: the stage shows through, text stays crisp */
  #hero{background:linear-gradient(135deg,rgba(36,12,58,.82),rgba(10,18,44,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 50px rgba(124,92,255,.35)}
  .row{background:rgba(12,12,22,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #empty{background:rgba(6,6,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .seg,.fxbtn{background:rgba(14,14,24,.85)}
  @media (max-width:820px){#deck{display:none}#term{width:auto;right:12px;font-size:12px}}

  /* ===== New-request FX overlay ===== */
  .fxbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:700;color:var(--muted)}
  .fxbtn.on{color:var(--text);border-color:var(--accent2);box-shadow:0 0 12px rgba(124,92,255,.5)}
  #fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;display:grid;place-items:center;opacity:0}
  #fx.run{animation:fxLife 5.6s ease forwards}
  @keyframes fxLife{0%{opacity:0}3%{opacity:1}86%{opacity:1}100%{opacity:0}}
  .fx-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(40,10,70,.92),rgba(3,3,8,.96) 70%)}
  .fx-flash{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,255,255,.85) 12%,rgba(124,92,255,.5) 30%,transparent 60%);opacity:0}
  #fx.run .fx-flash{animation:flash 1s ease-out}
  .fx-scan{position:absolute;left:0;right:0;height:3px;top:-5%;background:#fff;box-shadow:0 0 30px 8px rgba(255,255,255,.7),0 0 80px 20px rgba(255,61,127,.5);opacity:0}
  #fx.run .fx-scan{animation:scan 1.1s cubic-bezier(.5,0,.5,1) .05s}
  @keyframes scan{0%{top:-5%;opacity:1}100%{top:105%;opacity:.6}}
  @keyframes flash{0%{opacity:1;transform:scale(.4)}22%{opacity:0;transform:scale(1.2)}34%{opacity:.75;transform:scale(.9)}100%{opacity:0;transform:scale(1.7)}}
  /* Laser beams fanning from below */
  .fx-lasers{position:absolute;left:50%;bottom:-10%;width:0;height:0}
  .beam{position:absolute;left:0;bottom:0;width:4px;height:140vh;transform-origin:50% 100%;border-radius:4px;filter:blur(.5px);opacity:0}
  .beam::after{content:"";position:absolute;inset:0 -8px;background:inherit;filter:blur(10px);opacity:.7}
  #fx.run .beam{animation:sweep 4.9s ease-in-out .15s both}
  @keyframes sweep{0%{opacity:0;transform:rotate(var(--a0))}15%{opacity:.95}50%{transform:rotate(var(--a1))}85%{opacity:.9}100%{opacity:0;transform:rotate(var(--a0))}}
  /* Retro neon grid floor */
  .fx-grid{position:absolute;left:-50%;right:-50%;bottom:-5%;height:55%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;
    background-image:linear-gradient(rgba(255,61,127,.75) 2px,transparent 2px),linear-gradient(90deg,rgba(124,92,255,.75) 2px,transparent 2px);
    background-size:70px 70px;mask-image:linear-gradient(to top,#000 30%,transparent);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent)}
  #fx.run .fx-grid{animation:gridRun .5s linear infinite}
  @keyframes gridRun{to{background-position:0 70px,0 0}}
  /* Equalizer bars */
  .fx-eq{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;height:90px}
  .fx-eq i{width:10px;border-radius:3px;background:linear-gradient(to top,var(--accent),var(--accent2),#4de1ff);height:20%}
  #fx.run .fx-eq i{animation:eq .42s ease-in-out infinite alternate}
  @keyframes eq{to{height:100%}}
  /* Text */
  .fx-text{position:relative;text-align:center;padding:0 5vw;transform:scale(.6);opacity:0}
  #fx.run .fx-text{animation:slam .55s cubic-bezier(.2,1.6,.4,1) .12s forwards}
  @keyframes slam{0%{transform:scale(1.8);opacity:0;filter:blur(12px)}100%{transform:scale(1);opacity:1;filter:none}}
  .fx-label{font-size:clamp(14px,1.8vw,22px);letter-spacing:.5em;text-transform:uppercase;color:#4de1ff;font-weight:700;text-shadow:0 0 18px #4de1ff;margin-bottom:12px}
  .fx-song{font-size:clamp(44px,9vw,140px);font-weight:700;line-height:.95;color:#fff;word-break:break-word;
    text-shadow:0 0 30px rgba(255,61,127,.8),0 0 60px rgba(124,92,255,.6)}
  #fx.run .fx-song{animation:glitch 1.6s steps(1) .2s}
  @keyframes glitch{
    0%{text-shadow:-6px 0 #ff3d7f,6px 0 #4de1ff;transform:translate(0)}
    8%{text-shadow:5px 0 #ff3d7f,-5px 0 #4de1ff;transform:translate(-4px,2px) skewX(-6deg)}
    16%{text-shadow:-3px 0 #ff3d7f,3px 0 #4de1ff;transform:translate(3px,-1px)}
    24%{text-shadow:0 0 30px rgba(255,61,127,.8),0 0 60px rgba(124,92,255,.6);transform:none}
    60%{text-shadow:-4px 0 #ff3d7f,4px 0 #4de1ff;transform:translate(2px,0) skewX(4deg)}
    64%,100%{text-shadow:0 0 30px rgba(255,61,127,.8),0 0 60px rgba(124,92,255,.6);transform:none}}
  .fx-artist{font-size:clamp(22px,3.6vw,52px);color:#e4dcff;margin-top:12px;text-shadow:0 0 16px rgba(124,92,255,.8)}
  .fx-from{font-size:clamp(14px,1.6vw,20px);color:var(--muted);margin-top:14px}
  .fx-more{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;border-radius:999px;padding:4px 16px;font-weight:700;font-size:clamp(14px,1.6vw,20px)}
  @media (prefers-reduced-motion:reduce){
    #fx.run .beam,#fx.run .fx-grid,#fx.run .fx-eq i,#fx.run .fx-song{animation:none}
    .beam{opacity:.5;transform:rotate(var(--a1))}
    #fx.run .fx-flash,#fx.run .fx-scan{animation:none}
  }

  @media (max-width:640px){
    #hero{grid-template-columns:1fr}
    .h-actions{grid-template-columns:1fr 1fr}
    .big{min-width:0}
    .keys{display:none}
    .seg button{padding:8px 10px;font-size:14px}
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true">
  <canvas id="rain"></canvas>
  <canvas id="viz"></canvas>
  <div class="hud" id="term"></div>
  <div class="hud" id="deck">
    <div class="t"><span><span class="led" id="led"></span>DECK A · MASTER</span><span>SYNC ●</span></div>
    <div class="t" style="margin-top:6px">
      <div><div class="lbl">BPM</div><div class="dv" id="dBpm">126.0</div></div>
      <div><div class="lbl">KEY</div><div class="dv" id="dKey">8A</div></div>
      <div><div class="lbl">PITCH</div><div class="dv" id="dPitch">+0.0%</div></div>
      <div><div class="lbl">TIME</div><div class="dv" id="dTime">00:00</div></div>
    </div>
    <div class="lbl" style="margin-top:6px">CUED ▸</div>
    <div class="np" id="dNow">— waiting for the crowd —</div>
  </div>
</div>

<div id="gate" style="position:relative;z-index:1">
  <form id="pinForm">
    <h2>DJ Screen</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" autofocus>
    <button class="go" type="submit">Open</button>
    <div id="pinErr" style="color:var(--accent);min-height:20px"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><span class="dot off" id="dot" title="Connection"></span><span id="title">Requests</span></div>
    <div class="count" id="count"></div>
    <button class="fxbtn on" id="fxBtn" title="Animation for new requests">✨ FX</button>
    <div class="seg">
      <button id="sTop" class="on" title="Most requested first">🔥 Top</button>
      <button id="sNew" title="Newest first">🕒 New</button>
      <button id="sDone" title="Played and skipped">✓ Done</button>
    </div>
  </header>

  <section id="hero" hidden>
    <div>
      <div class="label"><span id="heroLabel">Next up</span><span class="badge" id="heroBadge" hidden></span></div>
      <div class="h-song" id="hSong"></div>
      <div class="h-artist" id="hArtist"></div>
      <div class="h-meta" id="hMeta"></div>
    </div>
    <div class="h-actions">
      <button class="big play" id="hPlay">✓ Played</button>
      <button class="big skip" id="hSkip">✕ Skip</button>
      <div class="keys">Keys: P played · S skip · U undo</div>
    </div>
  </section>
  <div id="empty" hidden></div>

  <section id="listWrap">
    <div class="listHead" id="listHead">Up next</div>
    <div id="list"></div>
  </section>
</div>

<div id="fx" aria-hidden="true">
  <div class="fx-bg"></div>
  <div class="fx-lasers" id="fxLasers"></div>
  <div class="fx-grid"></div>
  <div class="fx-flash"></div>
  <div class="fx-scan"></div>
  <div class="fx-eq" id="fxEq"></div>
  <div class="fx-text">
    <div class="fx-label">◆ New request ◆</div>
    <div class="fx-song" id="fxSong"></div>
    <div class="fx-artist" id="fxArtist"></div>
    <div class="fx-from" id="fxFrom"></div>
    <div class="fx-more" id="fxMore" hidden></div>
  </div>
</div>

<div id="toast" hidden><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig, DJ_NAME, DJ_PIN } from "./config.js";

const $ = id => document.getElementById(id);

// =====================================================================
//  DJ-hacker stage: code rain + spinning record + waveform + spectrum,
//  a live terminal and a deck readout. Runs behind everything.
// =====================================================================
const stage = (() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rainC = $("rain"), vizC = $("viz"), rc = rainC.getContext("2d"), vc = vizC.getContext("2d");
  const BPM = 126, DPR = Math.min(devicePixelRatio || 1, 1.5);
  let W = 0, H = 0, cols = [], surgeAt = -99, t0 = performance.now();

  const GLYPHS = "0123456789ABCDEF♪♫♬▲▼◆<>/=+#$%".split("");
  const WORDS = ["BPM","DROP","SYNC","CUE","BASS","LOOP","KICK","SNARE","FADER","MASTER","126","128","8A","PITCH","GAIN","REVERB","DECK_A","DECK_B","HYPE"];
  const COL_W = 18;

  function resize(){
    W = innerWidth; H = innerHeight;
    for (const c of [rainC, vizC]) { c.width = W * DPR; c.height = H * DPR; }
    rc.setTransform(DPR,0,0,DPR,0,0); vc.setTransform(DPR,0,0,DPR,0,0);
    rc.fillStyle = "#020205"; rc.fillRect(0,0,W,H);
    const n = Math.ceil(W / COL_W);
    cols = Array.from({length:n}, (_, i) => cols[i] || newCol(true));
  }
  function newCol(scatter){
    const r = Math.random();
    return { y: scatter ? Math.random() * -60 : -Math.random() * 20, speed: .25 + Math.random() * .55, buf: [],
             tint: r < .12 ? "pink" : r < .22 ? "cyan" : "green" };
  }
  function nextGlyph(c){
    if (!c.buf.length) {
      if (Math.random() < .3) c.buf = WORDS[Math.floor(Math.random()*WORDS.length)].split("");
      else for (let i = 0; i < 6; i++) c.buf.push(GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
    }
    return c.buf.shift();
  }
  const TINT = { green:"57,255,136", pink:"255,61,127", cyan:"77,225,255" };

  // Fake but musical "audio" energy per band
  function energy(i, t, beat){
    const low = i < 0.25 ? beat * 0.7 : beat * 0.25;
    const v = 0.32 + 0.22*Math.sin(t*3.1 + i*9) + 0.16*Math.sin(t*7.3 + i*23) + 0.1*Math.sin(t*1.3 + i*4) + low;
    return Math.max(0.04, Math.min(1, v));
  }
  function waveAt(x){ // deterministic waveform shape for the scrolling track
    return Math.abs(Math.sin(x*0.021)*0.5 + Math.sin(x*0.053+1.7)*0.3 + Math.sin(x*0.13+0.4)*0.2) * (0.55 + 0.45*Math.abs(Math.sin(x*0.004)));
  }

  function drawRain(t, surging){
    rc.fillStyle = surging ? "rgba(2,2,5,.18)" : "rgba(2,2,5,.11)";
    rc.fillRect(0,0,W,H);
    rc.font = "15px ui-monospace,Menlo,Consolas,monospace";
    rc.textAlign = "center";
    cols.forEach((c, i) => {
      c.y += c.speed * (surging ? 2.6 : 1);
      if (c.y < 0) return;
      const row = Math.floor(c.y);
      if (row === c.lastRow) return;
      c.lastRow = row;
      const x = i * COL_W + COL_W/2, y = row * 18;
      const tint = surging ? (i % 3 ? "pink" : "cyan") : c.tint;
      rc.fillStyle = `rgba(${TINT[tint]},.55)`;
      rc.fillText(c.prev || "", x, y - 18);
      const g = nextGlyph(c); c.prev = g;
      rc.fillStyle = "rgba(220,255,235,.9)";
      rc.fillText(g, x, y);
      if (y > H && Math.random() > .96) cols[i] = newCol(false);
    });
  }

  function drawViz(t){
    vc.clearRect(0,0,W,H);
    const phase = (t * BPM / 60) % 1, beat = Math.exp(-phase * 6);
    const sinceSurge = t - surgeAt;
    const phone = W < 820;

    // ---- Spinning record with a radial spectrum ring ----
    const cx = phone ? W*0.5 : W*0.76, cy = phone ? H*0.66 : H*0.5;
    const R = phone ? W*0.36 : Math.min(W,H)*0.27;
    const ang = t * (BPM / 60) * Math.PI * 0.5;   // 33⅓-ish feel, locked to the beat

    // Outer dashed rotating ring
    vc.save(); vc.translate(cx, cy);
    vc.strokeStyle = "rgba(77,225,255,.35)"; vc.lineWidth = 2; vc.setLineDash([4,10]); vc.lineDashOffset = -t*30;
    vc.beginPath(); vc.arc(0,0,R*1.62,0,Math.PI*2); vc.stroke(); vc.setLineDash([]);
    // Beat ticks
    for (let k = 0; k < 32; k++) {
      const a = k/32*Math.PI*2 - ang*0.25, on = k % 4 === 0;
      vc.strokeStyle = on ? `rgba(255,61,127,${.4+beat*.5})` : "rgba(255,255,255,.12)";
      vc.lineWidth = on ? 3 : 1.5;
      vc.beginPath(); vc.moveTo(Math.cos(a)*R*1.5, Math.sin(a)*R*1.5); vc.lineTo(Math.cos(a)*R*(on?1.42:1.46), Math.sin(a)*R*(on?1.42:1.46)); vc.stroke();
    }
    // Radial spectrum
    const N = 120;
    for (let k = 0; k < N; k++) {
      const f = k / N, e = energy(Math.abs(f - .5) * 2 * 0.6, t, beat);
      const a = f * Math.PI * 2 + ang * 0.15;
      const r1 = R * 1.06, r2 = r1 + R * (0.06 + e * 0.32);
      const hue = 320 + f * 200;
      vc.strokeStyle = `hsla(${hue % 360},95%,62%,${.45 + e*.45})`; vc.lineWidth = Math.max(2, R*0.022);
      vc.beginPath(); vc.moveTo(Math.cos(a)*r1, Math.sin(a)*r1); vc.lineTo(Math.cos(a)*r2, Math.sin(a)*r2); vc.stroke();
    }
    // Disc
    vc.rotate(ang);
    const dg = vc.createRadialGradient(0,0,R*0.1,0,0,R);
    dg.addColorStop(0,"#16141f"); dg.addColorStop(1,"#050508");
    vc.fillStyle = dg; vc.beginPath(); vc.arc(0,0,R,0,Math.PI*2); vc.fill();
    vc.strokeStyle = `rgba(124,92,255,${.5+beat*.4})`; vc.lineWidth = 3; vc.stroke();
    for (let k = 0; k < 16; k++) { vc.strokeStyle = "rgba(255,255,255,.045)"; vc.lineWidth = 1; vc.beginPath(); vc.arc(0,0,R*(0.38 + k*0.038),0,Math.PI*2); vc.stroke(); }
    // Light sheen
    vc.strokeStyle = "rgba(255,255,255,.13)"; vc.lineWidth = R*0.18; vc.lineCap = "round";
    vc.beginPath(); vc.arc(0,0,R*0.68,-0.5,0.1); vc.stroke();
    vc.beginPath(); vc.arc(0,0,R*0.68,Math.PI-0.5,Math.PI+0.1); vc.stroke();
    vc.lineCap = "butt";
    // Label
    const lg = vc.createLinearGradient(-R*.3,-R*.3,R*.3,R*.3);
    lg.addColorStop(0,"#ff3d7f"); lg.addColorStop(1,"#7c5cff");
    vc.fillStyle = lg; vc.beginPath(); vc.arc(0,0,R*0.3,0,Math.PI*2); vc.fill();
    vc.fillStyle = "rgba(0,0,0,.35)"; vc.fillRect(-R*0.02,-R*0.3,R*0.04,R*0.14);
    vc.fillStyle = "#fff"; vc.font = `700 ${Math.round(R*0.075)}px ui-monospace,Menlo,monospace`; vc.textAlign = "center";
    vc.fillText(DJ_NAME.toUpperCase(), 0, R*0.13);
    vc.fillStyle = "#020205"; vc.beginPath(); vc.arc(0,0,R*0.035,0,Math.PI*2); vc.fill();
    vc.restore();

    // Surge shockwave from the record when a request lands
    if (sinceSurge >= 0 && sinceSurge < 1.4) {
      const p = sinceSurge / 1.4;
      vc.strokeStyle = `rgba(255,255,255,${(1-p)*0.8})`; vc.lineWidth = 6*(1-p)+1;
      vc.beginPath(); vc.arc(cx, cy, R*(1 + p*3), 0, Math.PI*2); vc.stroke();
      vc.strokeStyle = `rgba(255,61,127,${(1-p)*0.6})`;
      vc.beginPath(); vc.arc(cx, cy, R*(1 + p*2.2), 0, Math.PI*2); vc.stroke();
    }

    // ---- Scrolling track waveform (Serato/Rekordbox style) ----
    const specH = H * 0.11, wy = H - specH - 46, wh = 34;
    const scroll = t * 90, mid = W / 2;
    for (let x = 0; x < W; x += 3) {
      const a = waveAt(x + scroll) * wh;
      const played = x < mid;
      vc.fillStyle = played ? "rgba(124,92,255,.35)" : (a > wh*0.62 ? "rgba(255,255,255,.75)" : "rgba(77,225,255,.6)");
      vc.fillRect(x, wy - a, 2, a*2);
    }
    // Beat grid
    const pxPerBeat = 90 * 60 / BPM;
    for (let x = (-(scroll) % pxPerBeat + pxPerBeat) % pxPerBeat; x < W; x += pxPerBeat) {
      vc.fillStyle = "rgba(255,255,255,.12)"; vc.fillRect(x, wy - wh - 6, 1, 6);
    }
    vc.fillStyle = "#fff"; vc.shadowColor = "#ff3d7f"; vc.shadowBlur = 14;
    vc.fillRect(mid - 1, wy - wh - 10, 2, wh*2 + 20); vc.shadowBlur = 0;

    // ---- Spectrum analyzer along the bottom ----
    const bars = phone ? 32 : 72, bw = W / bars;
    for (let k = 0; k < bars; k++) {
      const f = k / bars, e = energy(f, t, beat) * (sinceSurge >= 0 && sinceSurge < 1 ? 1.25 : 1);
      const h = Math.min(specH, specH * e);
      const g = vc.createLinearGradient(0, H, 0, H - specH);
      g.addColorStop(0, "rgba(255,61,127,.75)"); g.addColorStop(.6, "rgba(124,92,255,.65)"); g.addColorStop(1, "rgba(77,225,255,.7)");
      vc.fillStyle = g; vc.fillRect(k*bw + 2, H - h, bw - 4, h);
      vc.fillStyle = "rgba(255,255,255,.8)"; vc.fillRect(k*bw + 2, H - h - 4, bw - 4, 2);   // peak cap
    }
    return beat;
  }

  // ---- Terminal + deck readout ----
  const term = $("term");
  const CMDS = [
    () => `> sync deck_b --bpm ${BPM}.0 ... OK`,
    () => `> analyzing waveform [${"█".repeat(6+rnd(4))}${"░".repeat(2+rnd(2))}] ${70+rnd(29)}%`,
    () => `> crowd.energy = 0.${70+rnd(29)}`,
    () => `> fx.reverb wet=0.${10+rnd(40)} decay=${(1+Math.random()*2).toFixed(1)}s`,
    () => `> load cue_points ... ${2+rnd(7)} found`,
    () => `> eq.low ${Math.random()<.5?"+":"-"}${(Math.random()*3).toFixed(1)}dB  eq.hi ${Math.random()<.5?"+":"-"}${(Math.random()*2).toFixed(1)}dB`,
    () => `> harmonic match 8A <-> ${["9A","7A","8B"][rnd(3)]} ✓`,
    () => `> phase_lock deck_a:deck_b ±0.0${rnd(9)}ms`,
    () => `> 0x${hex()} 0x${hex()} 0x${hex()} 0x${hex()} 0x${hex()}`,
    () => `> loop ${[2,4,8,16][rnd(4)]} beats armed`,
    () => `> master.out -${(5+Math.random()*2).toFixed(1)} LUFS  peak -0.${rnd(9)}dB`,
    () => `> scanning request_queue ... ${queueLen} pending`,
    () => `> buffer ${[256,512][rnd(2)]} samples @ 48kHz OK`,
  ];
  function rnd(n){ return Math.floor(Math.random()*n); }
  function hex(){ return Math.floor(Math.random()*65536).toString(16).toUpperCase().padStart(4,"0"); }
  let queueLen = 0;
  function log(text, cls){
    term.querySelector(".cur")?.classList.remove("cur");
    const d = document.createElement("div"); d.textContent = text; if (cls) d.className = cls;
    d.classList.add("cur"); term.append(d);
    while (term.children.length > 14) term.firstChild.remove();
  }
  log(`> boot ${DJ_NAME.toLowerCase().replace(/[^a-z0-9]+/g,"_")}.requests v1.0 ...`, "cy");
  log("> link firebase://live ... CONNECTED");
  let nextLog = 0;

  let pitch = 0, t1 = 0;
  function updateDeck(t, beat){
    if (t > t1) { pitch = Math.max(-2, Math.min(2, pitch + (Math.random() - .5) * .3)); t1 = t + 0.6; $("dPitch").textContent = (pitch >= 0 ? "+" : "") + pitch.toFixed(1) + "%"; $("dBpm").textContent = (BPM * (1 + pitch/100)).toFixed(1); }
    const s = Math.floor(t) % 300; $("dTime").textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    $("led").classList.toggle("beat", beat > 0.5);
  }

  // ---- Main loop at ~30fps, paused when the tab is hidden ----
  let last = 0;
  function frame(now){
    if (!document.hidden && now - last > 33) {
      last = now;
      const t = (now - t0) / 1000;
      drawRain(t, t - surgeAt < 1.6);
      const beat = drawViz(t);
      updateDeck(t, beat);
      if (t > nextLog) { const c = CMDS[rnd(CMDS.length)](); log(c, Math.random() < .15 ? "cy" : ""); nextLog = t + 1.1 + Math.random() * 1.8; }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  resize();
  if (reduce) { drawRain(0,false); drawViz(0); } else requestAnimationFrame(frame);

  return {
    surge(){ surgeAt = (performance.now() - t0) / 1000; },
    log,
    setNow(song){ $("dNow").textContent = song || "— waiting for the crowd —"; },
    setQueue(n){ queueLen = n; },
  };
})();

let unlocked = false;
try { unlocked = sessionStorage.getItem("djOk") === "1"; } catch {}

$("pinForm").addEventListener("submit", e => {
  e.preventDefault();
  if ($("pin").value === DJ_PIN) { try { sessionStorage.setItem("djOk","1"); } catch {} start(); }
  else { $("pinErr").textContent = "Wrong PIN"; $("pin").value = ""; }
});
if (unlocked) start();

function start(){
  $("gate").hidden = true;
  $("app").hidden = false;
  $("title").textContent = DJ_NAME;
  keepAwake();

  const db = getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db, ".info/connected"), s => $("dot").classList.toggle("off", !s.val()));

  let mode = "top", rows = [], seen = null, fresh = new Set(), current = [], lastAction = null, toastTimer;

  const tabs = { top: $("sTop"), new: $("sNew"), done: $("sDone") };
  for (const [k, b] of Object.entries(tabs)) b.onclick = () => { mode = k; for (const x of Object.values(tabs)) x.classList.toggle("on", x === b); render(); };

  const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");

  function groupsFor(filter){
    const m = new Map();
    for (const r of rows.filter(filter)) {
      const k = norm(r.song) + "|" + norm(r.artist);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(r);
    }
    return [...m.values()].map(items => {
      items.sort((a,b) => (a.ts||0)-(b.ts||0));
      return { items, first: items[0], firstTs: items[0].ts||0, lastTs: items[items.length-1].ts||0,
               isFresh: items.some(r => fresh.has(r.id)) };
    });
  }

  function setStatus(g, st){
    const prev = g.items.map(r => [r.id, r.status]);
    stage.log(st === "played" ? `> deck_a.play("${g.first.song}") ✓` : st === "skipped" ? `> queue.skip("${g.first.song}")` : `> queue.restore("${g.first.song}")`, "cy");
    const u = {}; g.items.forEach(r => u[`requests/${r.id}/status`] = st);
    update(ref(db), u);
    lastAction = prev;
    showToast((st === "played" ? "Played: " : st === "skipped" ? "Skipped: " : "Back to queue: ") + g.first.song);
  }
  function undo(){
    if (!lastAction) return;
    const u = {}; lastAction.forEach(([id, st]) => u[`requests/${id}/status`] = st);
    update(ref(db), u); lastAction = null; $("toast").hidden = true;
  }
  function showToast(msg){
    $("toastMsg").textContent = msg; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; lastAction = null; }, 6000);
  }
  $("undoBtn").onclick = undo;

  $("hPlay").onclick = () => current[0] && setStatus(current[0], "played");
  $("hSkip").onclick = () => current[0] && setStatus(current[0], "skipped");
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "u") return undo();
    if (mode === "done" || !current[0]) return;
    if (k === "p") setStatus(current[0], "played");
    if (k === "s") setStatus(current[0], "skipped");
  });

  function render(){
    const queue = groupsFor(r => r.status === "new");
    const pending = queue.reduce((n, g) => n + g.items.length, 0);
    $("count").innerHTML = "";
    const b = document.createElement("b"); b.textContent = pending;
    $("count").append(b, document.createTextNode(pending === 1 ? " request" : " requests"));
    document.title = pending ? `(${pending}) ${DJ_NAME}` : DJ_NAME;
    stage.setQueue(pending);

    let list;
    if (mode === "done") {
      list = groupsFor(r => r.status !== "new").sort((a,b) => b.lastTs - a.lastTs);
    } else if (mode === "top") {
      // Most requested first; ties go to whoever has waited longest
      list = queue.sort((a,b) => b.items.length - a.items.length || a.firstTs - b.firstTs);
    } else {
      list = queue.sort((a,b) => b.lastTs - a.lastTs);
    }
    current = mode === "done" ? [] : list;

    // Hero
    const hero = mode === "done" ? null : list[0];
    $("hero").hidden = !hero;
    $("empty").hidden = !!hero || mode === "done";
    if (!hero && mode !== "done") { $("empty").textContent = "No requests yet — waiting for the crowd 🎧"; stage.setNow(""); }
    if (hero) {
      $("heroLabel").textContent = mode === "top" ? "Most requested" : "Newest request";
      $("hSong").textContent = hero.first.song;
      $("hArtist").textContent = hero.first.artist || "";
      $("hArtist").hidden = !hero.first.artist;
      $("heroBadge").hidden = hero.items.length < 2;
      $("heroBadge").textContent = "×" + hero.items.length;
      $("hMeta").textContent = metaText(hero);
      stage.setNow(hero.first.song + (hero.first.artist ? " — " + hero.first.artist : ""));
      $("hero").classList.remove("fresh");
      if (hero.isFresh) { void $("hero").offsetWidth; $("hero").classList.add("fresh"); }
    }

    // List
    const rest = mode === "done" ? list : list.slice(1);
    $("listHead").textContent = mode === "done" ? "Played & skipped" : rest.length ? "Up next" : "";
    const box = $("list"); box.replaceChildren();
    if (mode === "done" && !rest.length) box.append(el("div","r-sub","Nothing played yet."));
    rest.forEach((g, i) => {
      const row = el("div", "row" + (g.isFresh ? " fresh" : ""));
      const n = el("div", g.items.length > 1 ? "n hot" : "n", g.items.length > 1 ? "×" + g.items.length : String(i + 2));
      if (mode === "done") n.textContent = g.first.status === "played" ? "✓" : "✕";
      const info = el("div");
      info.append(el("div","r-song", g.first.song));
      info.append(el("div","r-sub", [g.first.artist, metaText(g)].filter(Boolean).join(" · ")));
      const act = el("div","r-actions");
      if (mode === "done") {
        const back = el("button","sm back","↩ Queue"); back.onclick = () => setStatus(g, "new"); act.append(back);
      } else {
        const p = el("button","sm play","✓"); p.title = "Played"; p.onclick = () => setStatus(g, "played");
        const s = el("button","sm skip","✕"); s.title = "Skip"; s.onclick = () => setStatus(g, "skipped");
        act.append(p, s);
      }
      row.append(n, info, act);
      box.append(row);
    });
    fresh = new Set();
  }

  function metaText(g){
    const names = [...new Set(g.items.map(r => r.name).filter(Boolean))];
    return ago(g.firstTs) + (names.length ? " · " + names.slice(0,3).join(", ") + (names.length > 3 ? ` +${names.length-3}` : "") : "");
  }
  // ----- New-request FX -----
  let fxOn = true;
  try { fxOn = localStorage.getItem("djFx") !== "off"; } catch {}
  const fxBtn = $("fxBtn");
  const paintFxBtn = () => fxBtn.classList.toggle("on", fxOn);
  paintFxBtn();
  fxBtn.onclick = () => { fxOn = !fxOn; try { localStorage.setItem("djFx", fxOn ? "on" : "off"); } catch {} paintFxBtn();
    if (fxOn) announce([{ song: "FX on", artist: "Ready for the crowd", name: "" }]); };

  // Build beams and EQ bars once
  const beamColors = ["#ff3d7f","#7c5cff","#4de1ff","#ff3d7f","#7c5cff","#4de1ff","#ff3d7f","#7c5cff"];
  beamColors.forEach((c, i) => {
    const b = document.createElement("div"); b.className = "beam";
    const base = -63 + i * 18;                         // fan from -63° to +63°
    const swing = (i % 2 ? 1 : -1) * 22;
    b.style.background = `linear-gradient(to top, ${c}, transparent)`;
    b.style.setProperty("--a0", base + "deg"); b.style.setProperty("--a1", (base + swing) + "deg");
    b.style.animationDelay = (0.1 + i * 0.04) + "s";
    $("fxLasers").append(b);
  });
  for (let i = 0; i < 24; i++) { const bar = document.createElement("i"); bar.style.animationDelay = (-Math.random()).toFixed(2) + "s"; bar.style.animationDuration = (0.3 + Math.random() * 0.3).toFixed(2) + "s"; $("fxEq").append(bar); }

  let fxQueue = [], fxBusy = false;
  function announce(items){
    if (!fxOn || !items.length) return;
    fxQueue.push(items);
    if (!fxBusy) playNext();
  }
  function playNext(){
    // Collapse everything waiting into one show: newest song as headline, "+N more"
    const items = fxQueue.flat(); fxQueue = [];
    if (!items.length) { fxBusy = false; return; }
    fxBusy = true;
    const r = items[items.length - 1];
    stage.surge();
    $("fxSong").textContent = r.song;
    $("fxArtist").textContent = r.artist || ""; $("fxArtist").hidden = !r.artist;
    $("fxFrom").textContent = r.name ? "from " + r.name : ""; $("fxFrom").hidden = !r.name;
    $("fxMore").hidden = items.length < 2; $("fxMore").textContent = `+${items.length - 1} more`;
    const fx = $("fx"); fx.classList.remove("run"); void fx.offsetWidth; fx.classList.add("run");
    setTimeout(() => { fx.classList.remove("run"); fxQueue.length ? playNext() : (fxBusy = false); }, 5700);
  }
  // The FX never blocks taps (pointer-events:none); Esc hides it early on a laptop
  document.addEventListener("keydown", e => { if (e.key === "Escape") { $("fx").classList.remove("run"); } });

  // Subscribe last, so everything above is defined before the first render
  onValue(ref(db, "requests"), snap => {
    const all = snap.val() || {};
    rows = Object.entries(all).map(([id, r]) => ({ id, ...r }));
    fresh = new Set();
    if (seen) rows.forEach(r => { if (!seen.has(r.id)) fresh.add(r.id); });
    seen = new Set(rows.map(r => r.id));
    const arrivals = rows.filter(r => fresh.has(r.id) && r.status === "new");
    arrivals.forEach(r => stage.log(`> INCOMING REQUEST :: "${r.song}"${r.artist ? " — " + r.artist : ""}${r.name ? "  [from " + r.name + "]" : ""}`, "hot"));
    announce(arrivals);
    render();
  });
  setInterval(render, 30000);
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ago(ts){
  if (!ts) return "just now";
  const m = Math.floor((Date.now()-ts)/60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m/60)}h ago`;
}
async function keepAwake(){
  try { await navigator.wakeLock.request("screen");
    document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") { try { await navigator.wakeLock.request("screen"); } catch {} } });
  } catch {}
}
</script>
</body>
