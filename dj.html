<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DJ Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070c;--card:#13131f;--line:#25253a;--text:#fff;--muted:#8d8daa;--accent:#ff3d7f;--accent2:#7c5cff;--ok:#2fd27a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
  #gate{min-height:100vh;display:grid;place-items:center;padding:16px}
  #gate form{display:grid;gap:12px;width:100%;max-width:300px;text-align:center}
  input{font:inherit;font-size:28px;text-align:center;letter-spacing:.3em;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;color:#fff;cursor:pointer;background:var(--card);border:1px solid var(--line)}
  .primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;font-size:18px}
  header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(7,7,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:22px}
  .live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 12px var(--ok)}
  .live.off{background:#666;box-shadow:none}
  .tabs{display:flex;gap:8px}
  .tabs button.on{background:var(--text);color:#000}
  #list{padding:20px 24px 60px;display:grid;gap:14px;max-width:1200px;margin:0 auto}
  .req{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent2);border-radius:16px;padding:18px 20px}
  .req.fresh{animation:flash 2.5s ease-out}
  @keyframes flash{0%{background:#3a1430;border-left-color:var(--accent)}100%{background:var(--card)}}
  .song{font-size:clamp(26px,3.6vw,44px);font-weight:700;line-height:1.05;word-break:break-word}
  .artist{font-size:clamp(18px,2.2vw,26px);color:#cfcfe6;margin-top:4px}
  .meta{font-size:15px;color:var(--muted);margin-top:8px}
  .count{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:3px 12px;margin-right:8px;font-size:16px}
  .actions{display:grid;gap:8px}
  .actions button{min-width:110px;font-size:16px}
  .played{background:var(--ok);color:#000;border:0}
  .empty{text-align:center;color:var(--muted);font-size:22px;padding:80px 0}
  @media (max-width:560px){.req{grid-template-columns:1fr}.actions{grid-auto-flow:column}}
</style>
</head>
<body>

<div id="gate">
  <form id="pinForm">
    <h2 style="margin:0">DJ Screen</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus>
    <button class="primary" type="submit">Open</button>
    <div id="pinErr" style="color:var(--accent);min-height:20px"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1><span class="live off" id="dot"></span><span id="title">Requests</span></h1>
    <div class="tabs">
      <button id="tQueue" class="on">Queue <span id="nQueue"></span></button>
      <button id="tDone">Played / skipped</button>
    </div>
  </header>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig, DJ_NAME, DJ_PIN } from "./config.js";

const $ = id => document.getElementById(id);
let unlocked = false;
try { unlocked = sessionStorage.getItem("djOk") === "1"; } catch {}

$("pinForm").addEventListener("submit", e => {
  e.preventDefault();
  if ($("pin").value === DJ_PIN) { try { sessionStorage.setItem("djOk","1"); } catch {} start(); }
  else { $("pinErr").textContent = "Wrong PIN"; $("pin").value = ""; }
});
if (unlocked) start();

function start(){
  $("gate").hidden = true; $("app").hidden = false;
  $("title").textContent = DJ_NAME + " — Requests";
  keepAwake();

  const db = getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db, ".info/connected"), s => $("dot").classList.toggle("off", !s.val()));

  let tab = "queue", rows = [], seen = null;
  $("tQueue").onclick = () => { tab="queue"; $("tQueue").classList.add("on"); $("tDone").classList.remove("on"); render(); };
  $("tDone").onclick  = () => { tab="done";  $("tDone").classList.add("on");  $("tQueue").classList.remove("on"); render(); };

  onValue(ref(db, "requests"), snap => {
    const all = snap.val() || {};
    rows = Object.entries(all).map(([id, r]) => ({ id, ...r }));
    const fresh = new Set();
    if (seen) rows.forEach(r => { if (!seen.has(r.id)) fresh.add(r.id); });
    seen = new Set(rows.map(r => r.id));
    render(fresh);
  });

  const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");

  function render(fresh = new Set()){
    const want = tab === "queue" ? r => r.status === "new" : r => r.status !== "new";
    const groups = new Map();
    for (const r of rows.filter(want)) {
      const k = norm(r.song) + "|" + norm(r.artist);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    let list = [...groups.values()].map(g => {
      g.sort((a,b) => (a.ts||0)-(b.ts||0));
      return { items: g, first: g[0], latest: g[g.length-1].ts||0, isFresh: g.some(r => fresh.has(r.id)) };
    });
    list.sort((a,b) => b.latest - a.latest);

    const nQ = rows.filter(r => r.status === "new").length;
    $("nQueue").textContent = nQ ? `(${nQ})` : "";
    document.title = nQ ? `(${nQ}) DJ Screen` : "DJ Screen";

    const box = $("list"); box.replaceChildren();
    if (!list.length) { const d = el("div","empty", tab==="queue" ? "No requests yet — waiting for the crowd 🎧" : "Nothing played yet"); box.append(d); return; }

    for (const g of list) {
      const card = el("div", "req" + (g.isFresh ? " fresh" : ""));
      const info = el("div");
      info.append(el("div","song", g.first.song));
      if (g.first.artist) info.append(el("div","artist", g.first.artist));
      const meta = el("div","meta");
      if (g.items.length > 1) meta.append(el("span","count", "×" + g.items.length));
      const names = [...new Set(g.items.map(r => r.name).filter(Boolean))];
      meta.append(document.createTextNode(ago(g.latest) + (names.length ? " · from " + names.join(", ") : "")));
      if (tab === "done") meta.append(document.createTextNode(" · " + g.first.status));
      info.append(meta);
      card.append(info);

      const act = el("div","actions");
      const setAll = st => { const u = {}; g.items.forEach(r => u[`requests/${r.id}/status`] = st); update(ref(db), u); };
      if (tab === "queue") {
        const p = el("button","played","✓ Played"); p.onclick = () => setAll("played");
        const s = el("button","","Skip"); s.onclick = () => setAll("skipped");
        act.append(p, s);
      } else {
        const b = el("button","","↩ Back to queue"); b.onclick = () => setAll("new");
        act.append(b);
      }
      card.append(act);
      box.append(card);
    }
  }
  setInterval(() => render(), 30000); // refresh "x min ago"
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ago(ts){
  if (!ts) return "just now";
  const m = Math.floor((Date.now()-ts)/60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m/60)}h ago`;
}
async function keepAwake(){
  try { let l = await navigator.wakeLock.request("screen");
    document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") l = await navigator.wakeLock.request("screen"); });
  } catch {}
}
</script>
</body>
</html>
